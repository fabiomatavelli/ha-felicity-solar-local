rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any custom actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any custom actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      Entities are updated through the DataUpdateCoordinator and do not
      subscribe to any external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any custom actions.
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: >-
      The battery's local protocol is unauthenticated, so there are no
      credentials to re-authenticate.
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The battery is configured by IP address; the integration has no discovery.
  discovery:
    status: exempt
    comment: >-
      The local protocol offers no discovery mechanism (no mDNS/SSDP/DHCP
      fingerprint); the battery is added by IP address.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents a single fixed battery.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Each config entry represents a single fixed battery.

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      The device client is vendored and fully async; there is no external
      dependency to make async.
  inject-websession:
    status: exempt
    comment: >-
      The integration talks to the battery over a raw TCP socket, not HTTP, so
      there is no web session to inject.
  strict-typing: todo
