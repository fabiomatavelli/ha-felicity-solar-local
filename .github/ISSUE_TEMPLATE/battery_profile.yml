name: Battery profile request
description: Ask for support for a Felicity Solar battery model that isn't recognized yet.
title: "[Battery profile] <model> (Type=?, SubType=?)"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! If the integration is already installed (unrecognized models still load, on a
        generic best-effort profile), the easiest source is its diagnostics - no extra tools
        needed, and the serial numbers and IP address are already redacted:

        **Settings** > **Devices & services** > **Felicity Solar Local** > the ⋮ menu of the
        battery's entry > **Download diagnostics**, then attach that file under "Raw device
        payload" below. Home Assistant also shows a repair linking here when it detects an
        unrecognized model.

        Not installed yet? From a clone of this repository, run
        `python3 scripts/probe.py --report <battery-ip>`: it prints the whole issue body with
        the serials redacted - paste it as-is into a
        [blank issue](https://github.com/fabiomatavelli/ha-felicity-solar-local/issues/new?title=%5BBattery+profile%5D)
        instead of this form. Plain `scripts/probe.py <ip>` (without `--report`) prints
        `DevSN` and `wifiSN` untouched: replace both values before pasting its output here.

        Please don't post your IP address, hostname or serial numbers.
  - type: input
    id: model
    attributes:
      label: Battery model
      description: Exact model from the battery's label.
      placeholder: FLA48300
    validations:
      required: true
  - type: input
    id: type_subtype
    attributes:
      label: Type / SubType
      description: >-
        `device_type`/`device_subtype` at the top of the diagnostics file, or the
        `Type`/`SubType` keys in the payload.
      placeholder: Type=112, SubType=7300
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Raw device payload
      description: >-
        Attach the diagnostics file (drag and drop it here), or paste the **complete** JSON
        object inside a ```json code block - every key, not just the ones that look
        relevant, since a partial payload can't be turned into a test fixture. Make sure
        `DevSN` and `wifiSN` are redacted (they are in diagnostics and `--report` output).
    validations:
      required: true
  - type: textarea
    id: vendor_readings
    attributes:
      label: Vendor app readings (for cross-checking)
      description: >-
        Optional, but it's what lets the profile be marked verified. Read these from the
        Felicity app/cloud at roughly the same moment as the payload above.
      value: |
        - SOC (%):
        - Pack voltage (V):
        - Current (A):
        - Temperature(s) (°C):
        - Capacity (Ah):
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else - firmware version, readings that look wrong, how many packs, etc.
