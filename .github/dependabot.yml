version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "fabiomatavelli"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Every pip dependency lives in requirements-test.txt, so separate PRs
    # touch adjacent lines and conflict with each other once one is merged.
    groups:
      test-dependencies:
        patterns:
          - "*"
